<svg width="860" height="760" viewBox="0 0 860 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Incident memory agent architecture</title>
<desc>Simulated Airflow, BigQuery, dbt, and CockroachDB signals flow through adapters into a Lambda decision step backed by Bedrock. Decisions read and write CockroachDB's incident pattern vector index, trust ledger, and decision log. Humans interact via a review queue and MCP-backed chat; approved CockroachDB-native remediations execute via ccloud CLI using Agent Skills. A dashed feedback loop runs from the human interface back into memory.</desc>

<rect x="0" y="0" width="860" height="760" fill="#FFFFFF"/>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Signal sources -->
<rect x="60" y="24" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="135" y="44" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#2C2C2A">Airflow signals</text>
<rect x="250" y="24" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="325" y="44" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#2C2C2A">BigQuery signals</text>
<rect x="440" y="24" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="515" y="44" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#2C2C2A">dbt signals</text>
<rect x="630" y="24" width="170" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="715" y="44" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#3C3489">CockroachDB signals</text>

<line x1="135" y1="64" x2="330" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>
<line x1="325" y1="64" x2="390" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>
<line x1="515" y1="64" x2="470" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>
<line x1="715" y1="64" x2="530" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<!-- Adapters -->
<rect x="280" y="112" width="300" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="430" y="132" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#2C2C2A">Adapter interface (per-system)</text>

<line x1="430" y1="152" x2="430" y2="186" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<!-- AWS container -->
<rect x="150" y="186" width="560" height="140" rx="20" fill="#E6F1FB" stroke="#185FA5"/>
<text x="170" y="212" font-family="Arial" font-size="14" font-weight="600" fill="#0C447C">AWS</text>
<text x="170" y="230" font-family="Arial" font-size="12" fill="#185FA5">Agent execution</text>

<rect x="180" y="248" width="230" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="295" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="14" font-weight="600" fill="#085041">Lambda</text>
<text x="295" y="284" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="12" fill="#0F6E56">decide / respond / teach</text>

<rect x="450" y="248" width="230" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="565" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="14" font-weight="600" fill="#085041">Bedrock</text>
<text x="565" y="284" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="12" fill="#0F6E56">Embeddings + reasoning</text>

<line x1="430" y1="326" x2="430" y2="360" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<!-- CockroachDB container -->
<rect x="110" y="360" width="640" height="160" rx="20" fill="#EEEDFE" stroke="#534AB7"/>
<text x="130" y="386" font-family="Arial" font-size="14" font-weight="600" fill="#3C3489">CockroachDB Cloud — persistent memory layer</text>

<rect x="140" y="404" width="180" height="88" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="230" y="426" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#712B13">incident_patterns</text>
<text x="230" y="446" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#993C1D">C-SPANN vector index</text>
<text x="230" y="464" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#993C1D">+ trust ledger</text>

<rect x="340" y="404" width="180" height="88" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="430" y="426" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#712B13">agent_decisions</text>
<text x="430" y="446" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#993C1D">every decision, incl.</text>
<text x="430" y="464" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#993C1D">memory on/off flag</text>

<rect x="540" y="404" width="180" height="88" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="630" y="426" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#712B13">runbook (view)</text>
<text x="630" y="446" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#993C1D">self-written docs,</text>
<text x="630" y="464" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#993C1D">always current</text>

<line x1="430" y1="520" x2="430" y2="552" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<!-- MCP -->
<rect x="330" y="552" width="200" height="48" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="430" y="570" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="14" font-weight="600" fill="#2C2C2A">MCP server</text>
<text x="430" y="588" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="12" fill="#5F5E5A">Audited access</text>

<line x1="430" y1="600" x2="430" y2="632" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>

<!-- Human interface -->
<rect x="270" y="632" width="320" height="48" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="430" y="650" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="14" font-weight="600" fill="#2C2C2A">Review queue · chat · trust grants</text>
<text x="430" y="668" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="12" fill="#5F5E5A">approve / modify / reject / teach</text>

<!-- ccloud branch (beat 6) -->
<rect x="640" y="560" width="180" height="88" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
<text x="730" y="584" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="13" font-weight="600" fill="#3C3489">ccloud CLI</text>
<text x="730" y="604" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#534AB7">+ Agent Skills repo</text>
<text x="730" y="622" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="11" fill="#534AB7">CRDB-native fixes only</text>

<line x1="590" y1="656" x2="638" y2="620" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arr)"/>
<text x="648" y="662" font-family="Arial" font-size="11" fill="#5F5E5A">on approval</text>

<!-- feedback loop -->
<path d="M270,656 C60,656 60,450 138,450" fill="none" stroke="#993C1D" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrf)"/>
<text x="66" y="540" font-family="Arial" font-size="11" fill="#993C1D" transform="rotate(-90 66 540)">teach · trust · confirm/refute</text>

<!-- Legend -->
<rect x="150" y="716" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
<text x="170" y="727" font-family="Arial" font-size="12" fill="#2C2C2A">AWS</text>
<rect x="260" y="716" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text x="280" y="727" font-family="Arial" font-size="12" fill="#2C2C2A">CockroachDB</text>
<rect x="410" y="716" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="430" y="727" font-family="Arial" font-size="12" fill="#2C2C2A">Human / interface</text>
<line x1="570" y1="723" x2="600" y2="723" stroke="#993C1D" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="606" y="727" font-family="Arial" font-size="12" fill="#2C2C2A">Feedback into memory</text>
</svg>
